<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectME Work</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/src/styles/design-system.css">
  <style>
    body {
      background: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-2xl) var(--space-md);
      margin: 0;
      position: relative;
    }

    /* Ambient drifting gradient */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 40%, rgba(255, 119, 1, 0.09), transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 60%, rgba(204, 95, 0, 0.06), transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 80%, rgba(255, 153, 62, 0.05), transparent 50%);
      animation: ambientDrift 25s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes ambientDrift {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.1) translate(-2%, 2%); }
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      width: 100%;
      max-width: 1200px;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .video-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      transition: all var(--duration-normal) var(--ease-out);
    }

    .video-container:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: var(--shadow-glow);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none; /* Prevents interaction to keep it strictly ambient */
    }
  </style>
</head>
<body>
  <div class="video-grid">
    <!-- Video 1 -->
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/m0FJur8BCNU?autoplay=1&mute=1&controls=0&loop=1&playlist=m0FJur8BCNU" title="ConnectME video 1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <!-- Video 2 -->
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/inCvbw8sFEY?autoplay=1&mute=1&controls=0&loop=1&playlist=inCvbw8sFEY" title="ConnectME video 2" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <!-- Video 3 -->
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/6En4lSzsiOc?autoplay=1&mute=1&controls=0&loop=1&playlist=6En4lSzsiOc" title="ConnectME video 3" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <!-- Video 4 -->
    <div class="video-container">
      <iframe src="https://www.youtube.com/embed/NJ_UfbKJz3s?autoplay=1&mute=1&controls=0&loop=1&playlist=NJ_UfbKJz3s" title="ConnectME video 4" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
